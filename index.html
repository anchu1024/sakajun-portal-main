<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ログイン</title>
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="auth-page">
    <header>
      <a href="../index.html"><img class="logo" src="../assets/logo.png" /></a>
    </header>
    <div class="login-main">
      <h1>ログインページ</h1>
      <p>下のボタンからGoogleアカウントでログインしてください</p>
      <div
        id="g_id_onload"
        data-client_id="277927079670-p82qmaf6g988ufrcjie8v53ldtd51cfi.apps.googleusercontent.com"
        data-auto_prompt="false"
        data-callback="handleCredentialResponse"
      ></div>
    </div>

    <div id="buttonDiv" class="g_id_signin" data-type="standard"></div>

    <button
      id="signout_button"
      onclick="handleSignOut();"
      style="display: none"
    >
      Sign out
    </button>

    <script>
      const allowList = [
        "s64005@salesio-gakuin.ac.jp",
        "s64092@salesio-gakuin.ac.jp",
      ];

      function parseJwt(token) {
        var base64Url = token.split(".")[1];
        var base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
        var jsonPayload = decodeURIComponent(
          window
            .atob(base64)
            .split("")
            .map(function (c) {
              return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
            })
            .join("")
        );
        return JSON.parse(jsonPayload);
      }

      function handleCredentialResponse(response) {
        try {
          const responsePayload = parseJwt(response.credential);

          const email = responsePayload.email;
          console.log("Logged in as: " + email);

          if (allowList.includes(email)) {
            document.body.style.background = "blue";
            document.getElementById("buttonDiv").style.display = "none";
            document.getElementById("signout_button").style.display = "block";
            sessionStorage.setItem("isAllowed", "Yes");
            sessionStorage.setItem("mail", email);
            handleSignOut();
            window.location.href = "./pages/main.html";
          } else {
            document.body.style.background = "red";
            handleSignOut();

            sessionStorage.setItem("isAllowed", "No");
            window.location.href = "./pages/reject.html";
          }
        } catch (e) {
          console.error(e);
          document.body.style.background = "black";
        }
      }

      function handleSignOut() {
        google.accounts.id.disableAutoSelect();

        document.body.style.background = "white";
        document.getElementById("buttonDiv").style.display = "block";
        document.getElementById("signout_button").style.display = "none";

        console.log("User signed out.");
      }
    </script>
  </body>
</html>
