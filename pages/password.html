<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>パスワード入力</title>
    <style>
      h1 {
        width: 100%;
        text-align: center;
        font-size: max(3vw, 20px);
      }

      p {
        width: 100%;
        height: auto;
        text-align: center;
      }

      form {
        width: 100%;
        min-height: 500px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .password-form {
        width: 100%;
        height: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: min(2vw, 20px);
        flex-wrap: wrap;
      }

      .password-el {
        border: 1px #1cb0f6 solid;
        border-radius: 10%;
        width: 5vw;
        height: 5vw;
        max-width: 100px;
        max-height: 100px;
        min-width: 70px;
        min-height: 70px;
        pointer-events: none;
        box-shadow: none;
        background: white;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        caret-color: transparent;
        font-size: min(50px, max(1vw, 30px));
      }

      .password-el:focus {
        outline: none;
        border: 3px solid #1cb0f6;
        box-shadow: 0px 3px 5px #1354;
        background: #eff;
      }
    </style>
  </head>
  <body>
    <h1>パスワードを入力してください</h1>
    <p>
      お手数をおかげしますがあらかじめ送られたパスワードを入れてください。
      パスワードはクッキーなどが削除されない限り、今後入力不要になります。
      パスワードが合ってる場合自動でページが遷移します。<br />
      なお貼り付ける時は一旦フォーカスを外すと安定してできます。(特にCtrl+Vで貼り付けショートカットでない人)
    </p>
    <form>
      <div class="password-form">
        <div tabindex="-1" data-index="1" class="password-el index-1"></div>
        <div tabindex="-1" data-index="2" class="password-el index-2"></div>
        <div tabindex="-1" data-index="3" class="password-el index-3"></div>
        <div tabindex="-1" data-index="4" class="password-el index-4"></div>
        <div tabindex="-1" data-index="5" class="password-el index-5"></div>
        <div tabindex="-1" data-index="6" class="password-el index-6"></div>
        <div tabindex="-1" data-index="7" class="password-el index-7"></div>
        <div tabindex="-1" data-index="8" class="password-el index-8"></div>
        <div tabindex="-1" data-index="9" class="password-el index-9"></div>
        <div tabindex="-1" data-index="10" class="password-el index-10"></div>
        <div tabindex="-1" data-index="11" class="password-el index-11"></div>
        <div tabindex="-1" data-index="12" class="password-el index-12"></div>
        <div tabindex="-1" data-index="13" class="password-el index-13"></div>
        <div tabindex="-1" data-index="14" class="password-el index-14"></div>
      </div>
    </form>
    <script>
      document.querySelector("form").addEventListener(
        "click",
        (e) => {
          e.preventDefault();
          const children = document.querySelector(".password-form").children;
          const now_pin = [...children].map((el) => el.textContent).join("");
          if (now_pin.length >= 14) {
            submit();
            return;
          }
          document
            .querySelector(`.password-el.index-${now_pin.length + 1}`)
            .focus();
        },
        { capture: true }
      );

      window.addEventListener(
        "keydown",
        (e) => {
          if (e.key === "Tab") {
            e.preventDefault();
          }
        },
        { capture: true }
      );

      window.addEventListener(
        "keyup",
        (e) => {
          if (e.key === "Tab") {
            e.preventDefault();
          }
        },
        { capture: true }
      );

      for (const el of document.querySelectorAll(".password-el")) {
        el.addEventListener("keydown", (e) => {
          if (!(e.key === "v" && e.ctrlKey)) {
            e.preventDefault();
          }
          const key = e.key;
          const index = Number(el.dataset.index);
          if (key === "Backspace" && index > 1)
            document.querySelector(`.index-${index - 1}`).focus();
          if (key.length > 1) return;
          if (key.charAt(0) >= 128) {
            return;
          }
          el.textContent = key.toUpperCase();
          if (index >= 14) {
            el.blur();
            submit();
            return;
          }
          document.querySelector(`.index-${index + 1}`).focus();
        });
        el.addEventListener("focus", (e) => {
          el.textContent = "";
        });
      }

      window.addEventListener("paste", (e) => {
        const data = e.clipboardData
          .getData("text")
          .replace(/[^\x00-\x7F]/g, "")
          .toUpperCase();
        for (let i = 0; i < data.length && i < 14; i++) {
          const el = document.querySelector(`.index-${i + 1}`);
          el.focus();
          el.textContent = data[i];
          if (i + 1 === 14) {
            el.blur();
            submit();
            break;
          }
        }
      });

      function submit() {
        const children = document.querySelector(".password-form").children;
        const now_pin = [...children].map((el) => el.textContent).join("");
        localStorage.setItem("code", now_pin);
        if (hash1(now_pin) === "959850f2") {
          window.location.href = "./main.html";
        } else {
          window.location.href = "./tango.html";
        }
      }

      function hash1(str) {
        if (typeof str !== "string") return 0;
        let hash = 5381;
        for (let i = 0; i < str.length; i++) {
          hash = (hash * 33) ^ str.charCodeAt(i);
        }
        return (hash >>> 0).toString(16);
      }
    </script>
  </body>
</html>
