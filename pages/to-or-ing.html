    <p>
      基本は3年2学期英作文演習⑥ (動名詞)の裏側と同じ形式で出題されます<br />
      まず、範囲を選択し、作成ボタンをクリックします。出てきた問題では左が問題文、右が解答欄です。解答欄はタップすることで入力できるようになります。<br />
